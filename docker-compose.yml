services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: sari_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sari_inventory}
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Error: DB_ROOT_PASSWORD must be set in .env}"
      MYSQL_USER: ${DB_USERNAME:-sari_user}
      MYSQL_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sari_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Laravel API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sari_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sari_inventory}
      DB_USERNAME: ${DB_USERNAME:-sari_user}
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sari_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: sari_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://backend:8000}
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - sari_network

volumes:
  db_data:

networks:
  sari_network:
    driver: bridge
