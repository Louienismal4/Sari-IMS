services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:17-alpine
    container_name: sari_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sari_inventory}
      POSTGRES_USER: ${DB_USERNAME:-sari_user}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sari_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sari_user} -d ${DB_DATABASE:-sari_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: sari_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sari_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Laravel API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sari_backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./.env:/var/www/html/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sari_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: sari_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./.env:/app/.env.local:ro
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - sari_network

volumes:
  pg_data:
  redis_data:

networks:
  sari_network:
    driver: bridge
