services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:17-alpine
    container_name: sari_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sari_inventory}
      POSTGRES_USER: ${DB_USERNAME:-sari_prod_user}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}"
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    networks:
      - sari_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sari_prod_user} -d ${DB_DATABASE:-sari_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue (Production)
  redis:
    image: redis:7-alpine
    container_name: sari_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - sari_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend (Production API)
  backend:
    image: ghcr.io/${DOCKER_IMAGE_OWNER:-louienismal4}/sari-ims/backend:${TAG:-latest}
    container_name: sari_backend_prod
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-https://sari.louienismal.com}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sari_inventory}
      DB_USERNAME: ${DB_USERNAME:-sari_prod_user}
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sari_network_prod

  # Next.js Frontend (Production Standalone Build)
  frontend:
    image: ghcr.io/${DOCKER_IMAGE_OWNER:-louienismal4}/sari-ims/frontend:${TAG:-latest}
    container_name: sari_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - sari_network_prod

  # Caddy Reverse Proxy (Serves Port 80 & Port 443 HTTPS)
  caddy:
    image: caddy:alpine
    container_name: sari_caddy_prod
    restart: always
    ports:
      - "${PORT:-80}:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-sari.louienismal.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    depends_on:
      - frontend
    networks:
      - sari_network_prod

volumes:
  pg_data_prod:
  redis_data_prod:
  caddy_data_prod:
  caddy_config_prod:

networks:
  sari_network_prod:
    driver: bridge
